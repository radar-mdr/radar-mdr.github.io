name: Pruebas

# Comprueba tipos, build y pruebas en cada cambio. Sirve sobre todo para los PR de
# Dependabot: si esto sale en verde, la actualización no ha roto nada.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos, build y pruebas del sitio
        run: npm run verificar

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Pruebas de la vigilancia
        run: |
          pip install -r scripts/requirements.txt
          python -m unittest discover -s scripts -p "test_*.py"
